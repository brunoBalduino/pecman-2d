<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Maze Duo</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<div class="game-page">

    <header class="header">

        <div class="brand">
            <div class="brand-icon">●</div>

            <div>
                <h1>NEON MAZE</h1>
                <p>DUO ARCADE</p>
            </div>
        </div>

        <button id="restartBtn" class="restart-btn">
            ↻ REINICIAR
        </button>

    </header>


    <section class="hud">

        <div class="player-panel red-panel">

            <div class="player-name">
                <span class="dot red"></span>
                PLAYER 1
            </div>

            <div id="score1" class="score">
                000000
            </div>

            <div id="lives1" class="lives">
                ♥ ♥ ♥
            </div>

        </div>


        <div class="center-panel">

            <div id="levelText">
                FASE 1
            </div>

            <div id="statusText">
                COLETE TODOS OS ORBES
            </div>

        </div>


        <div class="player-panel blue-panel">

            <div class="player-name">
                <span class="dot blue"></span>
                PLAYER 2
            </div>

            <div id="score2" class="score">
                000000
            </div>

            <div id="lives2" class="lives">
                ♥ ♥ ♥
            </div>

        </div>

    </section>


    <main class="game-shell">

        <canvas
            id="gameCanvas"
            width="896"
            height="640"
        ></canvas>


        <div id="overlay" class="overlay hidden">

            <div class="result-box">

                <div id="resultIcon" class="result-icon">
                    🏆
                </div>

                <h2 id="resultTitle">
                    VITÓRIA!
                </h2>

                <p id="resultText">
                    Você venceu!
                </p>

                <button
                    id="resultBtn"
                    class="result-btn"
                >
                    JOGAR NOVAMENTE
                </button>

            </div>

        </div>

    </main>


    <section class="instructions">

        <div class="control-card red-card">

            <strong>PLAYER 1</strong>

            <div class="key-row">
                <span>W</span>
            </div>

            <div class="key-row">
                <span>A</span>
                <span>S</span>
                <span>D</span>
            </div>

            <small>
                Movimento
            </small>

        </div>


        <div class="tips">

            <div>
                <b>●</b> Orb +10
            </div>

            <div>
                <b>◆</b> Power +50
            </div>

            <div>
                <b>◉</b> Portal
            </div>

            <div>
                <b>✦</b> Derrote inimigos
            </div>

        </div>


        <div class="control-card blue-card">

            <strong>PLAYER 2</strong>

            <div class="key-row">
                <span>↑</span>
            </div>

            <div class="key-row">
                <span>←</span>
                <span>↓</span>
                <span>→</span>
            </div>

            <small>
                Movimento
            </small>

        </div>

    </section>

</div>


<script src="script.js"></script>

</body> </html>
