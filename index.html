<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maze Hunters - 2 Players</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <header class="top-bar">

            <div class="logo">
                <span class="logo-icon">◉</span>

                <div>
                    <h1>MAZE HUNTERS</h1>
                    <p>DUO ARCADE</p>
                </div>
            </div>

            <button id="restartButton">
                ↻ REINICIAR
            </button>

        </header>


        <section class="score-board">

            <div class="player-card player-one">

                <div class="player-title">
                    <span class="player-dot red"></span>
                    PLAYER 1
                </div>

                <div
                    id="score1"
                    class="score"
                >
                    000000
                </div>

                <div
                    id="lives1"
                    class="lives"
                >
                    ❤️ ❤️ ❤️
                </div>

            </div>


            <div class="center-status">

                <div id="level">
                    FASE 1
                </div>

                <div id="status">
                    COLETE TODOS OS ORBES!
                </div>

            </div>


            <div class="player-card player-two">

                <div class="player-title">
                    <span class="player-dot blue"></span>
                    PLAYER 2
                </div>

                <div
                    id="score2"
                    class="score"
                >
                    000000
                </div>

                <div
                    id="lives2"
                    class="lives"
                >
                    ❤️ ❤️ ❤️
                </div>

            </div>

        </section>


        <main class="game-area">

            <canvas
                id="gameCanvas"
                width="960"
                height="640"
            ></canvas>


            <div
                id="message"
                class="message hidden"
            >

                <div class="message-box">

                    <div
                        id="messageIcon"
                        class="message-icon"
                    >
                        🏆
                    </div>

                    <h2 id="messageTitle">
                        VITÓRIA!
                    </h2>

                    <p id="messageText">
                        Todos os orbes foram coletados.
                    </p>

                    <button id="messageButton">
                        CONTINUAR
                    </button>

                </div>

            </div>

        </main>


        <section class="controls">

            <div class="control-box">

                <div class="control-title red-text">
                    PLAYER 1
                </div>

                <div class="keys">
                    <span>W</span>
                    <span>A</span>
                    <span>S</span>
                    <span>D</span>
                </div>

                <small>
                    Movimento
                </small>

            </div>


            <div class="game-info">

                <div>
                    🟡 Orb = +10
                </div>

                <div>
                    🔷 Power = +50
                </div>

                <div>
                    🌀 Portal
                </div>

                <div>
                    👻 Inimigo
                </div>

            </div>


            <div class="control-box">

                <div class="control-title blue-text">
                    PLAYER 2
                </div>

                <div class="keys">

                    <span>↑</span>
                    <span>←</span>
                    <span>↓</span>
                    <span>→</span>

                </div>

                <small>
                    Movimento
                </small>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
